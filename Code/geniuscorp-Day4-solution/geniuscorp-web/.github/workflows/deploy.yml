name: Build & Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated]        # มาจาก Laravel TriggerRebuild (driver=github)
  schedule:
    - cron: '0 20 * * *'            # build ทุกวัน 03:00 ไทย (20:00 UTC)
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (รวม GEO check)
        run: npm run build
        env:
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Copy .htaccess
        run: cp deploy/apache/.htaccess dist/.htaccess

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy (atomic release)
        run: |
          RELEASE="release-$(date +%Y%m%d-%H%M%S)"
          rsync -az --delete dist/ deploy@${{ secrets.DEPLOY_HOST }}:/var/www/geniuscorp-web-releases/$RELEASE/
          ssh deploy@${{ secrets.DEPLOY_HOST }} "ln -sfn /var/www/geniuscorp-web-releases/$RELEASE /var/www/geniuscorp-web-current && ls -dt /var/www/geniuscorp-web-releases/release-* | tail -n +4 | xargs -r rm -rf"

      - name: Smoke test
        run: |
          curl -sf https://www.geniuscorp.example/ > /dev/null
          curl -sf https://www.geniuscorp.example/sitemap.xml | grep -q "<urlset"
          curl -sf https://www.geniuscorp.example/llms.txt | grep -q "^# "

      - name: IndexNow (Bing)
        if: ${{ secrets.INDEXNOW_KEY != '' }}
        run: node scripts/indexnow.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
