# /etc/apache2/sites-available/geniuscorp-api.conf (Laravel API)
<VirtualHost *:80>
    ServerName api.geniuscorp.example
    RewriteEngine On
    RewriteRule ^ https://api.geniuscorp.example%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName api.geniuscorp.example
    DocumentRoot /var/www/geniuscorp-api/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/api.geniuscorp.example/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.geniuscorp.example/privkey.pem

    <Directory /var/www/geniuscorp-api/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # API ไม่ต้องให้ search engine index
    Header always set X-Robots-Tag "noindex, nofollow"

    ErrorLog  ${APACHE_LOG_DIR}/geniuscorp-api-error.log
    CustomLog ${APACHE_LOG_DIR}/geniuscorp-api-access.log combined
</VirtualHost>
